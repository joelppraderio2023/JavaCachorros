<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Peso de Cachorros</title>
  <link rel="stylesheet" href="estilos.css" />
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/main.js" defer></script>
  <script src="./js/peso.js" defer></script>
</head>
<body>
  <div id="contenedor">
    <h1>Seguimiento de Peso de Cachorros</h1>
    <div id="entradaDatos">
      <label for="inputCantidad">Cantidad de cachorros:</label>
      <input type="number" id="inputCantidad" required min="1" max="12"/>
      <button id="btnIniciar">Iniciar</button>
    </div>
    <div id="sectionPeso" style="display: none;">
      <h2>Ingrese el peso diario de cada cachorro:</h2>
      <ul id="listaPesos"></ul> 
      <div id="mensaje"></div>
      <button id="btnGuardarPesos">Guardar Pesos</button>
      <button id="btnReiniciar">Reiniciar Datos</button> 
    </div>
  </div>
</body>
</html>
